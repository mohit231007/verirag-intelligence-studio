[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "verirag-intelligence-studio"
version = "0.1.0"
description = "Evidence-gated, auditable document intelligence application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.38,<2",
  "chromadb>=0.5,<2",
  "fastembed>=0.3,<1",
  "groq>=0.11,<1",
  "pypdf>=4.3,<7",
  "python-docx>=1.1,<2",
  "pandas>=2.2,<4",
  "python-dotenv>=1.0,<2",
  "reportlab>=4.2,<5",
  "socksio>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["core*", "components*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
