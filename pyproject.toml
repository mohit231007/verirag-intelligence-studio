[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "verirag-intelligence-studio"
version = "0.2.0"
description = "Evidence-gated, auditable document intelligence and RAG evaluation workbench"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.38,<2",
  "chromadb>=0.5,<2",
  "fastembed>=0.3,<1",
  "groq>=0.11,<1",
  "pypdf>=4.3,<7",
  "python-docx>=1.1,<2",
  "pandas>=2.2,<4",
  "python-dotenv>=1.0,<2",
  "reportlab>=4.2,<5",
  "socksio>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["core*", "components*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# gold_eval intentionally keeps typing.Iterable/Sequence and a quoted classmethod return
# compatible with the project's Python 3.11 floor while using future annotations.
"core/gold_eval.py" = ["UP035", "UP037"]
# These cleanup paths deliberately swallow teardown failures: cleanup must not mask a
# completed user action or benchmark result when an ephemeral Chroma collection is gone.
"app.py" = ["SIM105"]
"core/benchmark_lab.py" = ["SIM105"]
